html/head_include="<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap\" rel=\"stylesheet\"><style>html,body,canvas{touch-action:none}body{background:#170d24}#status{background:radial-gradient(circle at 50% 62%,#2e1a48 0%,#170d24 60%,#0b0612 100%)!important;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Fredoka,sans-serif}#status-splash{display:none!important}#status::before{content:'Hubble Bubble';font-size:min(14vw,72px);font-weight:600;color:#8fe36b;text-shadow:0 6px 0 #2a1630,0 0 24px #5aff8a88;margin-bottom:6px}#status::after{content:'stirring the cauldron...';font-size:min(5vw,22px);color:#d8c8f0;margin-top:18px;animation:bub 1.6s ease-in-out infinite}#status-progress{width:min(70vw,420px);height:18px;border-radius:9px;border:3px solid #2a1630;background:#3a2448;accent-color:#7aff5a;overflow:hidden;-webkit-appearance:none;appearance:none}#status-progress::-webkit-progress-bar{background:#3a2448;border-radius:9px}#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#4ab83a,#9aff6a);border-radius:9px}#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#4ab83a,#9aff6a)}#status-notice{color:#ffcf9a;font-family:Fredoka,sans-serif}@keyframes bub{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}</style>"
